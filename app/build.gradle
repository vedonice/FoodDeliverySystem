plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.myprojects'
version = '1.0.0'
description = 'FoodDeliverySystem'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'  // for controllers
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'  // for db store of entities
    implementation 'org.springframework.kafka:spring-kafka'  // for kafka producer/consumer
    compileOnly 'org.projectlombok:lombok'  // for lombok annotations
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'  // for test classes
}

tasks.named('test') {
    useJUnitPlatform()
}
